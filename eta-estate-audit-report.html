<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Return Sequence &amp; Ledger Audit — ETA Estate Modeler</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d1b2e; --navy-2:#152640; --gold:#c9a84c; --gold-lt:#dfc278; --gold-pale:#f7f0e0;
  --off:#f5f3ee; --border:#ddd8ce; --muted:#8a8070; --green:#2a6e45; --red:#8b2020; --text:#1a1a2a; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--off);color:var(--text)}
.hdr{background:var(--navy);padding:16px 32px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(201,168,76,.2)}
.hdr .t{font-family:'Playfair Display',serif;color:var(--white);font-size:17px;font-weight:600}
.hdr .b{font-size:9px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-top:2px}
.hdr .warn{margin-left:auto;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.4)}
.page{max-width:1500px;margin:0 auto;padding:28px 24px 60px}
.meta{font-size:11px;color:var(--muted);margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid var(--gold)}
.meta b{color:var(--navy)}
.tabs{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--border);border-radius:5px;overflow:hidden;max-width:560px}
.tab{flex:1;padding:11px 10px;border:none;background:var(--white);font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);text-align:center;border-right:1px solid var(--border)}
.tab:last-child{border-right:none}
.tab.active{background:var(--navy);color:var(--gold)}
.band-sub{font-size:9px;letter-spacing:.3px;color:rgba(255,255,255,.5);display:block;font-weight:400;margin-top:2px}
.tab.active .band-sub{color:rgba(201,168,76,.65)}
.section{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:18px 20px;margin-bottom:22px}
.section h2{font-family:'Playfair Display',serif;font-size:14px;color:var(--navy);margin-bottom:4px}
.section .sub{font-size:10.5px;color:var(--muted);margin-bottom:12px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:10.3px}
table.ledger{min-width:1200px}
thead tr.grp th{background:var(--navy);color:rgba(255,255,255,.7);font-size:8.5px;letter-spacing:.6px;text-transform:uppercase;padding:6px 8px;text-align:center}
thead tr.cols th{background:var(--off);color:var(--navy);font-size:9px;letter-spacing:.2px;padding:6px 7px;text-align:right;border-bottom:1.5px solid var(--gold);white-space:nowrap}
thead tr.cols th:first-child, thead tr.cols th:nth-child(2){text-align:left}
tbody td{padding:4px 7px;text-align:right;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace;white-space:nowrap}
tbody td:first-child, tbody td:nth-child(2){text-align:left;font-family:'IBM Plex Sans',sans-serif}
tbody tr:nth-child(even){background:rgba(245,243,238,.6)}
tbody tr.rmd-start td{border-top:2px solid var(--gold)}
.yr-badge{display:inline-block;background:var(--gold-pale);color:var(--navy);border-radius:2px;padding:1px 5px;font-size:9.5px;font-weight:600}
.wrap-x{overflow-x:auto}
.foot-note{font-size:9.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <div class="t">Return Sequence &amp; Ledger Audit</div>
    <div class="b">ETA Estate Modeler &middot; Internal / Advisor Use Only</div>
  </div>
  <div class="warn">Not for client presentation</div>
</div>
<div class="page" id="page-body">
  <div class="empty">Loading&hellip;</div>
</div>

<script>
(function(){
  var r=null;
  try { r = JSON.parse(localStorage.getItem('eta_estate_audit_data')||'null'); } catch(e) {}
  var body = document.getElementById('page-body');
  if (!r || !r.bands) {
    body.innerHTML = '<div class="empty">Run the estate comparison in the modeler first, then reopen this audit report.</div>';
    return;
  }

  var $f = function(n){ return (n===undefined||n===null||isNaN(n)) ? '\u2014' : '$'+Math.round(n).toLocaleString(); };
  var pct = function(n){ return (n===undefined||n===null||isNaN(n)) ? '\u2014' : (n*100).toFixed(2)+'%'; };

  var meta = '<div class="meta"><b>Client:</b> '+(r.clientName||'\u2014')+
    ' &nbsp;|&nbsp; <b>Advisor:</b> '+(r.advisor||'\u2014')+
    ' &nbsp;|&nbsp; <b>Account Holder Age:</b> '+(r.age||'\u2014')+
    ' &nbsp;|&nbsp; <b>Horizon:</b> Age '+(r.horizonAge||'\u2014')+
    ' &nbsp;|&nbsp; <b>Carrier:</b> '+(r.carrier==='PL'?'Pacific Life':'National Life Group')+' \u00b7 '+(r.policyType||'')+
    ' &nbsp;|&nbsp; <b>Simulations:</b> '+(r.sims||0).toLocaleString()+
    ' &nbsp;|&nbsp; '+(r.date||'')+'</div>';

  // The life insurance policy is a single deterministic carrier illustration —
  // it does not vary by percentile, so it's shown once, not banded.
  function buildPolicySection(){
    var rows = r.carrierRows||[];
    var body = rows.map(function(row){
      return '<tr><td>'+row.y+'</td><td>'+(row.a2!=null?row.a+'/'+row.a2:row.a)+'</td>'+
        '<td>'+$f(row.p)+'</td><td>'+(row.l?$f(row.l):'\u2014')+'</td>'+
        '<td>'+(row.lb?$f(row.lb):'\u2014')+'</td><td>'+$f(row.av)+'</td>'+
        '<td>'+$f(row.sv)+'</td><td>'+$f(row.db)+'</td></tr>';
    }).join('');
    return '<div class="section">'+
      '<h2>Life Insurance Policy \u2014 Debits &amp; Credits</h2>'+
      '<div class="sub">Single deterministic carrier illustration (Insured age track). Not percentile-banded \u2014 identical across all three QP strands below, since the policy\u2019s crediting is taken as-illustrated by the carrier, not re-simulated here.</div>'+
      '<div class="wrap-x"><table class="ledger"><thead>'+
      '<tr class="cols"><th>Yr</th><th>Age(s)</th><th>Premium</th><th>Policy Loan</th><th>Loan Balance</th><th>Gross AV</th><th>Surrender Value</th><th>Net Death Benefit</th></tr>'+
      '</thead><tbody>'+body+'</tbody></table></div></div>';
  }

  var PCTS=['p25','p50','p75'];
  var labels={p25:'25th Percentile',p50:'50th Percentile (Median)',p75:'75th Percentile'};

  var tabsHtml = '<div class="tabs">'+PCTS.map(function(p,i){
    var b = r.bands[p];
    return '<button class="tab'+(i===0?' active':'')+'" data-p="'+p+'" onclick="showBand(\''+p+'\')">'+labels[p]+
      '<span class="band-sub">'+$f(b?b.income:0)+' combined at horizon</span></button>';
  }).join('')+'</div>';

  function qpTable(rows, titleCols){
    var rmdStarted=false, body='';
    rows.forEach(function(row){
      var isRmdStart = !rmdStarted && row.rmd>0;
      if (isRmdStart) rmdStarted=true;
      body += '<tr'+(isRmdStart?' class="rmd-start"':'')+'>'+
        '<td>'+row.a+'</td>'+
        '<td><span class="yr-badge">'+(row.hy!==undefined?row.hy:'\u2014')+'</span></td>'+
        '<td>'+pct(row.ret)+'</td>'+
        (titleCols==='eta' ? '<td>'+$f(row.dist)+'</td>' : '') +
        '<td>'+$f(row.rmd)+'</td>'+
        '<td>'+$f(row.tax)+'</td>'+
        '<td>'+$f(row.irmaa)+'</td>'+
        (titleCols==='dn' ? '<td>'+$f(row.drag)+'</td>' : '') +
        '<td>'+$f(row.qp)+'</td>'+
        '<td>'+$f(row.side)+'</td>'+
        '<td>'+$f(row.basis)+'</td>'+
        '<td>'+$f(row.cum)+'</td>'+
        '</tr>';
    });
    return body;
  }

  function buildBandSection(p){
    var b = r.bands[p];
    if (!b) return '<div class="empty">No data for this band.</div>';

    return '<div class="section">'+
      '<h2>'+labels[p]+' \u2014 Take No Action</h2>'+
      '<div class="sub">One specific seeded simulation out of '+(r.sims||0).toLocaleString()+
      ' \u2014 the one whose combined qualified-plan + side-account balance at the horizon landed at this percentile. '+
      'Historical year and return are the actual bootstrapped draw for that simulation, reproducible from its seed.</div>'+
      '<div class="wrap-x"><table class="ledger"><thead>'+
      '<tr class="cols"><th>Age</th><th>Hist. Yr</th><th>Blended Return</th><th>Required Distribution</th><th>Tax Paid</th><th>IRMAA</th><th>Cap Gains Drag</th><th>QP Balance</th><th>Side Account</th><th>Side Basis</th><th>Cumulative Tax</th></tr>'+
      '</thead><tbody>'+qpTable(b.doNothingRows,'dn')+'</tbody></table></div>'+
      '</div>'+

      '<div class="section">'+
      '<h2>'+labels[p]+' \u2014 ETA Path (Side Account After Repositioning)</h2>'+
      '<div class="sub">Same historical sequence and same qualified-plan mechanics, but starting after the distribution that funded the policy has left the plan. This is the "what stays behind" QP side of the comparison \u2014 the policy itself is the deterministic ledger above.</div>'+
      '<div class="wrap-x"><table class="ledger"><thead>'+
      '<tr class="cols"><th>Age</th><th>Hist. Yr</th><th>Blended Return</th><th>Distribution Out</th><th>Required Distribution</th><th>Tax Paid</th><th>IRMAA</th><th>QP Balance</th><th>Side Account</th><th>Side Basis</th><th>Cumulative Tax</th></tr>'+
      '</thead><tbody>'+qpTable(b.etaRows,'eta')+'</tbody></table></div>'+
      '<div class="foot-note">Distribution Out = the annual qualified-plan distribution funding the policy premium during the pay-years window; Required Distribution = any RMD still owed on the balance remaining in the plan afterward.</div>'+
      '</div>';
  }

  window.showBand = function(p){
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.p===p); });
    document.getElementById('band-content').innerHTML = buildBandSection(p);
  };

  body.innerHTML = meta + buildPolicySection() + tabsHtml + '<div id="band-content"></div>';
  showBand('p50');
})();
</script>
</body>
</html>
