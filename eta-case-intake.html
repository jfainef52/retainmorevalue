    const byClient = answers.respondent_role === "client";
    const who = byClient ? (answers.client_name || "Client") : (answers.advisor_name || "Advisor");

    line("Submitted " + new Date().toLocaleString("en-US", { dateStyle: "long", timeStyle: "short" }), 10, false, [90, 100, 112], 0);
    line("Submitted by: " + (byClient ? who + " (the client, self-submitted)" : who + " (advisor)"), 10, false, [90, 100, 112], 0);
    if (submissionId) line("Submission ID: " + submissionId, 8, false, [130, 138, 148], 6); else y += 6;

      room(40); y += 6; doc.setDrawColor(200, 169, 110); doc.setLineWidth(0.8); doc.line(M, y, W - M, y); y += 14;

      sec.items.forEach(it => {

        doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); const lw = doc.splitTextToSize(lab, 170);

}

  else if (src === "iqp") D = a.iqp_defer === "yes" ? num(a.iqp_balance) : num(a.iqp_balance) / 10;
  else if (src === "nqp") D = num(a.nqp_amount) * (1 - Math.min(100, num(a.nqp_basis_pct)) / 100);
  else if (src === "liq") D = num(a.liq_gain);
  const fedBr = FED_ORD[filing];
  const fedMarginal = marginalAt(T, fedBr);
  const fed = gains ? (D > 0 ? effectiveOn(T, D, FED_LTCG[filing]) : marginalAt(T, FED_LTCG[filing])) : effectiveOn(T, D, fedBr);
  const code = a.client_state; const name = STATE_NAME[code] || ""; const age = ageFromDOB(a.client_dob);
  let state = 0, stateNote = "Pick a state of residence to estimate this.";
  if (code) {
    if (NO_INCOME_TAX.includes(code)) { state = 0; stateNote = name + " has no state income tax."; }
    else if (code === "WA") {
      if (gains && a.liq_type !== "sale_of_real_estate" && D > 270000) { state = 0.07; stateNote = "Washington taxes long-term capital gains above about $270,000 at 7% (real estate is excluded). Approximate."; }
      else { state = 0; stateNote = "Washington has no tax on wages or retirement income, and only taxes large long-term capital gains."; }
    }
    else if (!gains && ["IL", "IA", "MS", "PA"].includes(code) && (code === "IL" || age === null || age >= (code === "IA" ? 55 : 59.5))) {
      state = 0;
      stateNote = name + " does not tax IRA and 401(k) distributions" + (code === "IL" ? "." : age === null ? " once the age requirement is met (" + (code === "IA" ? "55" : "59½") + ")." : ".");
    }
    else if (gains && code === "MO") { state = 0; stateNote = "Missouri does not tax capital gains."; }
    else if (STATE_TAX[code]) {
      const br = STATE_TAX[code][filing]; state = effectiveOn(T, D, br);
      stateNote = name + " income tax, estimated at " + pct(state) + " on this income." + (!gains && ["IA", "MS", "PA"].includes(code) ? " The retirement-income exemption needs age " + (code === "IA" ? "55" : "59½") + "+." : "");
    }
  }
  return { filing, assumed, taxable_income: T, annual_amount: Math.round(D), fed_marginal: fedMarginal, fed, state, combined: fed + state, state_note: stateNote, kind: gains ? "capital gains" : "ordinary income" };
}
// What gets saved: the estimate plus any override the person entered after reviewing it.
function derivedFacts(a) {
  const out = {}; const yrs = ageFromDOB(a.client_dob);
  if (yrs !== null) { out.account_holder_age = Math.floor(yrs); out.under_59_5 = yrs < 59.5; }
  const est = taxEstimate(a);
  if (est) {
    const own = a.tax_confirm === "no";
    const fed = own && String(a.tax_fed_override || "").trim() !== "" ? num(a.tax_fed_override) / 100 : est.fed;
    const st = own && String(a.tax_state_override || "").trim() !== "" ? num(a.tax_state_override) / 100 : est.state;
    out.tax = { filing_status: est.filing, taxable_income: est.taxable_income, annual_amount_taxed: est.annual_amount, income_type: est.kind,
      federal_bracket_today: est.fed_marginal, federal_rate_estimated: est.fed, state_rate_estimated: est.state,
      confirmed: a.tax_confirm === "yes" ? "yes" : own ? "entered own rates" : "not confirmed",
      federal_rate_used: fed, state_rate_used: st, combined_rate_used: fed + st };
  }
  return out;
}

function buildScreens(answers) {
  const out = [];
  SCREEN_DEFS.forEach(def => {
    if (def.cond && !def.cond(answers)) return;
    const qs = def.questions.filter(q => !q.cond || q.cond(answers));
    if (!qs.length) return;
    out.push({ id: def.id, title: def.title, phase: def.phase, questions: qs, blocks: def.blocks || [] });
  });
  return out;
}

function formatPhone(v) {
  let d = String(v || "").replace(/\D/g, ""); if (d.length === 11 && d[0] === "1") d = d.slice(1); d = d.slice(0, 10);
  if (d.length === 0) return ""; if (d.length <= 3) return "(" + d; if (d.length <= 6) return "(" + d.slice(0, 3) + ") " + d.slice(3);
  return "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6);
}
function hasAnswer(question, answer) {
  if (answer === undefined || answer === null) return false;
  if (Array.isArray(answer)) return answer.length > 0;
  return String(answer).trim() !== "";
}
function canContinue(question, answer) {
  if (!question) return false;
  if (question.required && !hasAnswer(question, answer)) return false;
  if (question.type === "email" && hasAnswer(question, answer)) return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(answer).trim());
  return true;
}
function fmtAnswer(q, v, answers) {
  if (!hasAnswer(q, v)) return "—";
  const optLabel = id => {
    const o = (q.options || []).find(x => x.id === id);
    if (!o) return id;
    if (o.other) { const t = (answers[q.id + "__other"] || "").trim(); return t ? "Something else: " + t : o.label; }
    return o.label;
  };
  if (q.type === "single" || q.type === "select") return optLabel(v);
  if (q.type === "multi") return v.map(optLabel).join("; ");
  if (q.type === "currency") return fmtCurrency(v) || String(v);
  if (q.type === "date") return fmtDate(v);
  if (q.type === "number") return String(v);
  return String(v).trim();
}

// A readable copy of the answers, grouped the way they were asked.
function buildSummary(screens, answers) {
  const sections = [], skipped = [];
  screens.forEach(s => {
    const items = s.questions.filter(q => hasAnswer(q, answers[q.id])).map(q => ({ label: q.label, value: fmtAnswer(q, answers[q.id], answers) }));
    const missing = s.questions.filter(q => !hasAnswer(q, answers[q.id])).map(q => q.label);
    if (items.length) sections.push({ title: s.title, section: SECTION_LABELS[s.phase] || "", items });
    if (missing.length) skipped.push({ title: s.title, labels: missing });
  });
  const dv = derivedFacts(answers), items = [];
  if (dv.account_holder_age !== undefined) { items.push({ label: "Account holder's age (from date of birth)", value: String(dv.account_holder_age) }); items.push({ label: "Under age 59½", value: dv.under_59_5 ? "Yes" : "No" }); }
  if (dv.tax) {
    const t = dv.tax;
    items.push({ label: "Tax filing status used", value: t.filing_status === "joint" ? "Married filing jointly" : "Single" });
    items.push({ label: "Federal bracket today", value: pct(t.federal_bracket_today) });
    items.push({ label: "Estimated federal rate on the dollars reallocated", value: pct(t.federal_rate_estimated) + " (" + t.income_type + ")" });
    items.push({ label: "Estimated state rate", value: pct(t.state_rate_estimated) });
    items.push({ label: "Rates confirmed by the person filling this out", value: t.confirmed === "yes" ? "Yes" : t.confirmed === "entered own rates" ? "No, entered their own" : "Not confirmed" });
    items.push({ label: "Federal rate used", value: pct(t.federal_rate_used) });
    items.push({ label: "State rate used", value: pct(t.state_rate_used) });
    items.push({ label: "Combined rate used", value: pct(t.combined_rate_used) });
  }
  if (items.length) sections.push({ title: "Calculated", section: "Calculated", items });
  return { sections, skipped };
}
// Headline lines for the notification email. No dollar figures.
function headlineLines(screens, answers) {
  const byId = {};
  screens.forEach(s => s.questions.forEach(q => { byId[q.id] = q; }));
  const pick = (id, label) => (byId[id] && hasAnswer(byId[id], answers[id])) ? [label, fmtAnswer(byId[id], answers[id], answers)] : null;
  return [
    pick("respondent_role", "Submitted by"), pick("client_email", "Client email"), pick("client_phone", "Client phone"),
    pick("advisor_name", "Advisor"), pick("advisor_firm", "Firm"), pick("advisor_email", "Advisor email"), pick("advisor_phone", "Advisor phone"),
    pick("referred_by", "Referred by"),
    pick("client_state", "State"), pick("goals", "Goals"), pick("source_of_funds", "Source of dollars"),
    pick("insured_who", "Insured"), pick("audience", "Audience"), pick("needed_by", "Needed by"),
  ].filter(Boolean).concat(derivedFacts(answers).tax ? [["Combined tax rate used", pct(derivedFacts(answers).tax.combined_rate_used)]] : []);
}

function CurrencyField({ value, onChange, placeholder, baseInputStyle }) {
  const format = raw => (raw === "" || raw === undefined ? "" : Number(raw).toLocaleString("en-US"));
  const [display, setDisplay] = useState(format(value));
  useEffect(() => { setDisplay(format(value)); }, [value]);
  const handleChange = e => {
    const input = e.target;
    const prevLen = input.value.length;
    const caret = input.selectionStart;
    const raw = input.value.replace(/[^0-9]/g, "");
    const nextDisplay = format(raw);
    setDisplay(nextDisplay);
    onChange(raw);
    requestAnimationFrame(() => {
      if (!input) return;
      const pos = Math.max(0, (caret || 0) + (nextDisplay.length - prevLen));
      try { input.setSelectionRange(pos, pos); } catch (e) {}
    });
  };
  return (
    <div style={{ position: "relative" }}>
      <span style={{ position: "absolute", left: 16, top: "50%", transform: "translateY(-50%)", color: GRAY, fontSize: 15 }}>$</span>
      <input type="text" inputMode="numeric" value={display} placeholder={placeholder || "0"} onChange={handleChange} style={{ ...baseInputStyle, paddingLeft: 30 }} />
    </div>
  );
}

function TaxBlock({ answers }) {
  const e = taxEstimate(answers); if (!e) return null;
  const row = (l, v, strong) => <div style={{ display: "flex", justifyContent: "space-between", gap: 12, padding: "7px 0", borderBottom: "1px solid rgba(255,255,255,.06)", fontSize: strong ? 15 : 13.5, fontWeight: strong ? 700 : 400, color: strong ? GOLD2 : OFFWHITE }}><span style={{ color: strong ? GOLD2 : WARM }}>{l}</span><span>{v}</span></div>;
  return (
    <div style={{ marginBottom: 22, padding: "14px 16px", borderRadius: 12, background: "rgba(255,255,255,.04)", border: "1px solid rgba(200,169,110,.25)" }}>

function FieldRow({ q, value, other, onChange, onOther, answers }) {
  const [open, setOpen] = useState(!!q.whyOpen);
  const inputStyle = { width: "100%", padding: "12px 14px", background: "rgba(255,255,255,.05)", border: `1px solid ${BORDER}`, borderRadius: 10, color: OFFWHITE, fontSize: 15, outline: "none" };
  const infoBtn = q.why ? (
    <button type="button" onClick={() => setOpen(o => !o)} aria-label="Why we ask" style={{ marginLeft: 8, width: 18, height: 18, borderRadius: "50%", border: "1px solid #4A6070", color: GRAY, fontSize: 10, verticalAlign: "middle", lineHeight: "16px", padding: 0 }}>?</button>
  ) : null;
  const infoPanel = open && q.why && (
    <div style={{ margin: "6px 0 10px", padding: "10px 12px", borderRadius: 9, background: "rgba(255,255,255,.04)", fontSize: 12.5, lineHeight: 1.55, color: GRAY }}>
      <span style={{ color: WARM }}>Why we ask: </span>{q.why}
    </div>
  );

  let control = null, showOther = false;
  const sel = (q.options || []).find(o => o.id === value);
  if (q.type === "single") {
    control = <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{q.options.map(o => <Pill key={o.id} label={o.label} selected={value === o.id} onClick={() => onChange(value === o.id ? "" : o.id)} />)}</div>;
    showOther = !!(sel && sel.other);
  } else if (q.type === "select") {
    control = (
      <select value={value || ""} onChange={e => onChange(e.target.value)} style={SELECT_STYLE}>
        <option value="">Select…</option>
        {q.options.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
      </select>
    );
    showOther = !!(sel && sel.other);
  } else if (q.type === "multi") {
    const cur = Array.isArray(value) ? value : [];
    const toggle = id => onChange(cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id]);
    control = <div>{q.options.map(o => <CheckItem key={o.id} label={o.label} selected={cur.includes(o.id)} onClick={() => toggle(o.id)} />)}</div>;
    showOther = q.options.some(o => o.other && cur.includes(o.id));
  } else if (q.type === "phone") {
    control = <input type="tel" inputMode="tel" autoComplete="tel" value={value || ""} placeholder="(555) 555-5555" onChange={e => onChange(formatPhone(e.target.value))} style={inputStyle} />;
  } else if (q.type === "text" || q.type === "email") {
    control = <input type={q.type === "email" ? "email" : "text"} value={value || ""} placeholder={q.placeholder || ""} onChange={e => onChange(e.target.value)} style={inputStyle} />;
  } else if (q.type === "number") {
    control = <input type="number" inputMode="decimal" value={value === undefined ? "" : value} placeholder={q.placeholder || ""} onChange={e => onChange(e.target.value)} style={inputStyle} />;
  } else if (q.type === "currency") {
    control = <CurrencyField value={value} onChange={onChange} placeholder={q.placeholder} baseInputStyle={inputStyle} />;
  } else if (q.type === "date") {
    control = <input type="date" value={value || ""} onChange={e => onChange(e.target.value)} style={{ ...inputStyle, colorScheme: "dark" }} />;
  } else if (q.type === "textarea") {
    control = <textarea value={value || ""} placeholder={q.placeholder || ""} rows={3} onChange={e => onChange(e.target.value)} style={{ ...inputStyle, resize: "vertical", lineHeight: 1.5 }} />;
  }

  return (
    <div style={{ marginBottom: 22, paddingTop: 4 }}>
      <div style={{ fontSize: 13.5, fontWeight: 600, color: WARM, marginBottom: 8, lineHeight: 1.4 }}>{q.label}{infoBtn}</div>
      {infoPanel}
      {q.hint && (() => { const h = q.hint(answers || {}); return h ? <p style={{ fontSize: 12.5, color: GOLD2, margin: "0 0 10px", lineHeight: 1.5 }}>{h}</p> : null; })()}
      {control}
      {showOther && (
        <input type="text" value={other || ""} placeholder="Please tell us more" onChange={e => onOther(e.target.value)} style={{ ...inputStyle, marginTop: 8 }} />
      )}
      {q.type === "email" && hasAnswer(q, value) && !canContinue(q, value) && <p style={{ fontSize: 12, color: GRAY, marginTop: 6 }}>Please enter a valid email address, or clear the field to skip.</p>}
    </div>
  );
}

function readSaved() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const saved = JSON.parse(raw);
    if (!saved || !saved.savedAt || Date.now() - saved.savedAt > SAVE_TTL_MS) { localStorage.removeItem(SAVE_KEY); return null; }
    return saved;
  } catch (e) { return null; }
}
function clearSaved() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

function App() {
  const [view, setView] = useState("welcome"); // welcome, flow, review, thanks
  const [answers, setAnswers] = useState({});
  const [step, setStep] = useState(0);
  const [editing, setEditing] = useState(false);
  const [hasSaved, setHasSaved] = useState(false);
  const [busy, setBusy] = useState(false);
  const [submitError, setSubmitError] = useState("");
  const [honeypot, setHoneypot] = useState("");

  useEffect(() => {
    const s = document.createElement("style"); s.textContent = GS; document.head.appendChild(s);
    setHasSaved(!!readSaved());
    return () => document.head.removeChild(s);
  }, []);
  useEffect(() => {
    if (view === "flow" || view === "review") {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify({ answers, step, savedAt: Date.now() })); } catch (e) {}
    }
  }, [answers, step, view]);

  const screens = buildScreens(answers);
  const idx = Math.min(step, Math.max(screens.length - 1, 0));
  const current = screens[idx];

  const start = () => { clearSaved(); setAnswers({}); setStep(0); setEditing(false); setView("flow"); };
  const resume = () => {
    const saved = readSaved();
    if (!saved) { start(); return; }
    setAnswers(saved.answers || {}); setStep(saved.step || 0); setEditing(false); setView("flow");
  };
  const discardSaved = () => { clearSaved(); setHasSaved(false); };
  const setAnswer = (qid, val) => setAnswers(prev => ({ ...prev, [qid]: val }));
  const setOther = (qid, text) => setAnswers(prev => ({ ...prev, [qid + "__other"]: text }));
  const next = () => {
    if (editing) { setEditing(false); setView("review"); return; }
    if (idx >= screens.length - 1) { setView("review"); return; }
    setStep(idx + 1);
  };
  const back = () => {
    if (editing) { setEditing(false); setView("review"); return; }
    if (idx > 0) setStep(idx - 1);
  };
  const editQuestion = qid => {
    const i = screens.findIndex(s => s.questions.some(q => q.id === qid));
    if (i >= 0) { setStep(i); setEditing(true); setView("flow"); }
  };

  const submit = async () => {
    if (busy) return;
    setBusy(true); setSubmitError("");
    // Only answers to questions that are currently shown are sent.
    const shownIds = new Set(screens.flatMap(s => s.questions.map(q => q.id)));
    const clean = {};
    Object.keys(answers).forEach(k => {
      const base = k.replace(/__other$/, "");
      if (shownIds.has(base) && hasAnswer({}, answers[k])) clean[k] = answers[k];
    });
    if (!PREVIEW) {
      const all = screens.flatMap(s => s.questions);
      const res = await callSubmit({
        answers: { ...clean, __derived: derivedFacts(answers) }, website: honeypot,
        summary: buildSummary(screens, answers),
        meta: { form: "eta-case-intake", version: 1, question_count: all.length, skipped_count: all.filter(q => !hasAnswer(q, answers[q.id])).length },
      });
      if (!res.ok) {
        setBusy(false);
        setSubmitError(res.error === "offline"
          ? "We couldn't reach our server. Check your connection and tap Try again. Your answers are saved on this device."
          : "Something went wrong sending your answers. Please tap Try again, or call 773-318-9608 if it keeps happening.");
        return;
      }
      notifyTeam(answers, headlineLines(screens, answers), res.submission_id, buildSummary(screens, answers));
    }
    clearSaved();
    setBusy(false);
    setView("thanks");
  };

  // Hidden honeypot field: people never see it; form-filling bots do.
  const trap = <input tabIndex={-1} autoComplete="off" aria-hidden="true" value={honeypot} onChange={e => setHoneypot(e.target.value)} name="website" style={{ position: "absolute", left: "-9999px", width: 1, height: 1, opacity: 0 }} />;

  let body = null;
  if (view === "welcome") body = <WelcomeScreen onStart={start} hasSaved={hasSaved} onResume={resume} onClear={discardSaved} />;
  else if (view === "review") body = <ReviewScreen screens={screens} answers={answers} onEdit={editQuestion} onSubmit={submit} busy={busy} error={submitError} />;
  else if (view === "thanks") body = <ThanksScreen answers={answers} screens={screens} onStartOver={start} />;
  else if (view === "flow" && current) body = <ScreenView screen={current} answers={answers} onAnswer={setAnswer} onOther={setOther} onNext={next} onBack={back} stepNum={idx + 1} totalSteps={screens.length || 1} editing={editing} />;
  return <>{body}{trap}</>;
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
